<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name – Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar"></div>
<div class="page">
 <header class="top">
  <div class="photo" id="ph" aria-hidden="true"></div>
  <div>
   <h1><span id="nm"></span><svg class="ver" viewBox="0 0 24 24" fill="currentColor" aria-label="Verified"><circle cx="12" cy="12" r="11"/><path d="m7 12.5 3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></h1>
   <p class="sub" id="lc"></p>
   <p class="role" id="rl"></p>
   <div class="btns"><a class="b dark" id="rs" href="#"><svg class="ic" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>View projects</a><a class="b" id="em" href="#"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Send email</a></div>
  </div>
  <button id="tg" type="button" aria-label="Toggle dark mode"></button>
 </header>
 <div class="stats" id="stats"></div>
 <div class="grid">
  <div class="col">
   <section class="card"><h2>About</h2><div id="ab"></div></section>
   <section class="card"><h2>Tech stack</h2><div id="ts"></div></section>
   <section class="card" id="projects"><h2>Projects</h2><div id="pj"></div></section>
  </div>
  <div class="col"><section class="card"><h2>Education</h2><ol class="tl" id="ex"></ol></section><section class="card"><h2>Career interests</h2><div class="chips" id="ci"></div></section><section class="card"><h2>Strengths</h2><div class="chips" id="st"></div></section></div>
 </div>
 <div class="col" style="margin-top:1rem">
  <section class="card"><div class="row3"><div><h2>Goals</h2><div id="go"></div></div><div><h2>Social links</h2><div id="so"></div></div><div><h2>Contact</h2><div id="co"></div></div></div></section>
  <section class="card"><h2>Gallery</h2><div class="gal" id="ga"></div></section>
 </div>
 <footer id="ft"></footer>
</div>
<div id="fab"><span class="tip">Any questions?</span><button class="o" id="op" type="button" aria-label="Open chat"><svg class="ic" style="margin:0" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button></div>
<div id="chat" role="dialog" aria-label="Chat">
 <div class="ch"><div class="photo" id="cp"></div><div><b id="cn"></b><span class="on">Online</span></div><button id="cl" type="button" aria-label="Close chat">✕</button></div>
 <div id="msgs" aria-live="polite"></div>
 <form class="cf" id="cf"><input id="cin" placeholder="Type your message…" autocomplete="off"><button type="submit">Send</button></form>
</div>
<script src="script.js"></script>
</body>
</html>
